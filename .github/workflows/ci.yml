name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm run build
