packages:
  - packages/*

catalogMode: strict

catalog:
  "@cloudflare/workers-types": ^5.20261004.1
  "@better-auth/expo": ^1.7.7
  "@better-auth/passkey": ^1.7.7
  "@rafters/ledger": ^0.4.0
  "@rafters/release": ^0.1.1
  "@types/node": ^24
  better-auth: ^1.7.7
  typescript: ^7.0.2
  uuidv7: ^1.2.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  zod: ^4.6.5
catalogs:
  # Peer ranges: what a brand may install, wider than the versions this repo builds against.
  peers:
    "@rafters/ledger": ">=0.4.0 <1.0.0"
    "@better-auth/expo": ">=1.7.7 <2.0.0"
    "@better-auth/passkey": ">=1.7.7 <2.0.0"
    better-auth: ">=1.7.7 <2.0.0"
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@rafters/release@0.1.1"
