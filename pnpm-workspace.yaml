packages:
  - packages/*

catalogMode: strict

configDependencies:
  "@rafters/toolchain": 0.1.1

catalog:
  "@better-auth/api-key": ^1.7.7
  "@better-auth/expo": ^1.7.7
  "@better-auth/passkey": ^1.7.7
  "@rafters/ledger": ^0.5.0
  "@rafters/release": ^0.1.2
  "@rafters/toolchain": 0.1.1
  better-auth: ^1.7.7
  uuidv7: ^1.2.1
catalogs:
  # Peer ranges: what a brand may install, wider than the versions this repo builds against.
  peers:
    "@rafters/ledger": ">=0.5.0 <1.0.0"
    "@better-auth/api-key": ">=1.7.7 <2.0.0"
    "@better-auth/expo": ">=1.7.7 <2.0.0"
    "@better-auth/passkey": ">=1.7.7 <2.0.0"
    better-auth: ">=1.7.7 <2.0.0"
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@rafters/release@0.1.2"
  - "@rafters/ledger@0.5.0"
  - "@rafters/toolchain@0.1.1"
